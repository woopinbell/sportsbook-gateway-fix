spring:
  application:
    name: gateway

server:
  # Public front door. Downstream services sit behind it: wallet 8081,
  # betting 8082, odds-feed 8085 (see each service's application.yml).
  port: ${GATEWAY_HTTP_PORT:8080}
  shutdown: graceful

# ADR-0007: Actuator health (liveness/readiness split) + Prometheus scrape.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      service: gateway

logging:
  level:
    root: INFO
    com.sportsbook.gateway: INFO
