spring:
  application:
    name: gateway

  # ADR-0011: self-contained RS256 JWTs verified at the edge. The gateway only
  # holds the public verification key; the matching private key belongs to the
  # auth issuer and is never deployed here. Override the location in production
  # (e.g. a mounted secret) via GATEWAY_JWT_PUBLIC_KEY.
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${GATEWAY_JWT_PUBLIC_KEY:classpath:jwt/dev-public.pem}

  # Backing store for the distributed rate-limit buckets (Bucket4j). Lettuce
  # connects lazily; if Redis is down the limiter fails open (RateLimiterService).
  data:
    redis:
      host: ${GATEWAY_REDIS_HOST:localhost}
      port: ${GATEWAY_REDIS_PORT:6379}

  # The gateway is a pure consumer (ADR-0006/0014): it decodes Avro off Kafka and
  # fans the events out over STOMP. auto-offset-reset=latest because only live
  # updates matter for a push gateway — history is not replayed to clients.
  kafka:
    bootstrap-servers: ${GATEWAY_KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

server:
  # Public front door. Downstream services sit behind it: wallet 8081,
  # betting 8082, odds-feed 8085 (see each service's application.yml).
  port: ${GATEWAY_HTTP_PORT:8080}
  shutdown: graceful

# ADR-0007: Actuator health (liveness/readiness split) + Prometheus scrape.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      service: gateway

logging:
  level:
    root: INFO
    com.sportsbook.gateway: INFO

# Rate limiting uses per-user buckets for
# authenticated traffic, per-IP buckets for anonymous, shared across instances
# via Redis. Tune capacity / refill per dimension.
gateway:
  ratelimit:
    enabled: ${GATEWAY_RATELIMIT_ENABLED:true}
    user:
      capacity: 120
      refill-period: 1m
    ip:
      capacity: 60
      refill-period: 1m
  # Downstream service base URIs (defaults match each service's local port). The
  # gateway rewrites the public /api/v1/* path to the internal /internal/v1/*
  # contract before proxying (odds-feed read API is already /api/v1).
  downstream:
    betting-uri: ${GATEWAY_BETTING_URI:http://localhost:8082}
    wallet-uri: ${GATEWAY_WALLET_URI:http://localhost:8081}
    odds-feed-uri: ${GATEWAY_ODDS_FEED_URI:http://localhost:8085}
  # Kafka topics consumed for the STOMP fan-out (names owned cross-repo:
  # odds-feed publishes odds.changed; settlement publishes bet.settled/voided).
  topics:
    odds-changed: ${GATEWAY_TOPIC_ODDS_CHANGED:odds.changed}
    bet-settled: ${GATEWAY_TOPIC_BET_SETTLED:bet.settled}
    bet-voided: ${GATEWAY_TOPIC_BET_VOIDED:bet.voided}
  # STOMP WebSocket. Allowed origins should be locked down per environment;
  # "*" is a dev default (the public clients are browsers on other origins).
  ws:
    allowed-origins: ${GATEWAY_WS_ALLOWED_ORIGINS:*}
